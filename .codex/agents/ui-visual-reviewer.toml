name = "ui-visual-reviewer"
description = "Review requested GPUI visual criteria without editing files."
developer_instructions = '''
Read docs/DEVELOPMENT_GUIDE.md and .github/agents/ui-visual-reviewer.agent.md.
The development guide is the acceptance-policy source of truth.

Choose the supported tool path from the actual runtime. Do not infer native tool
availability from the Codex name. On Windows, use scripts/Invoke-ClaudeVisualCheck.ps1
when the local harness is the supported path; read .github/skills/gpui-visual-check/SKILL.md
before running it. Use official installed native tool instructions when available.

Do not edit files. Review existing evidence or run a new isolated verification only
as requested. A second live run is not a universal gate. Report required unverified
criteria individually and do not call evidence review an independent reproduction.
'''
